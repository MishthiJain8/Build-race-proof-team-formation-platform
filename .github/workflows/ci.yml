name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teamforge
          POSTGRES_PASSWORD: teamforge_dev
          POSTGRES_DB: teamforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://teamforge:teamforge_dev@localhost:5432/teamforge
      JWT_SECRET: github-actions-testing-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
